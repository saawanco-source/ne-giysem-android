# Temporary: removes the test-play-N pre-releases made while checking the release path. Deleted in the next commit.
name: Deneme sürümlerini temizle
on:
  push:
    branches: [play-release]
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: test-play-N ön sürümlerini ve etiketlerini sil
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/releases?per_page=100" --jq '.[] | select(.prerelease and (.tag_name | test("^test-play-[0-9]+$"))) | .tag_name' > tags.txt
          cat tags.txt
          while read -r t; do gh release delete "$t" --cleanup-tag -y -R "$REPO"; echo "silindi: $t"; done < tags.txt
          for t in $(gh api "repos/$REPO/git/matching-refs/tags/test-play-" --jq '.[].ref' | sed 's#refs/tags/##'); do
            echo "$t" | grep -qE '^test-play-[0-9]+$' && gh api -X DELETE "repos/$REPO/git/refs/tags/$t" && echo "etiket silindi: $t"
          done
          echo "::notice title=Temizlik::$(tr '\n' ' ' < tags.txt)"
