name: APK oluştur

on:
  push:
    # main: the real release ("Ne Giysem? N", the site's download). dev: a test build ("Ne Giysem? deneme N", a
    # pre-release: the site and Play never pick it up) for the phone, talking to the dev branch's preview site.
    branches: [main, dev]
    # Pages that only the website serves (privacy texts) and store/docs notes don't change the APK.
    paths-ignore:
      - "web/gizlilik.html"
      - "web/privacy.html"
      - "store/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      deneme_imza:
        description: "Yalnız deneme (main dışında): yayın yolunu o an üretilen geçici bir anahtarla dene. Dosyalar Play'e yüklenemez, yayımlanmaz."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REL_TAG: ${{ github.ref == 'refs/heads/main' && format('surum-{0}', github.run_number) || format('deneme-{0}', github.run_number) }}
  # A dev build's app (and the page inside it) uses the dev branch's preview site; Cloudflare Pages makes it.
  NG_API: ${{ github.ref == 'refs/heads/dev' && 'https://dev.ne-giysem.pages.dev' || '' }}

jobs:
  # Testers that run on every change: the app in a real browser (phone size), and web vs widget engine parity.
  web-tests:
    name: Web testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Before anything slow: with a wrong hash in its Content-Security-Policy the page's script wouldn't run at all.
      - name: Sayfanın güvenlik politikası kodla eşleşiyor mu
        run: |
          node tools/csp.js --check \
            || { echo "::error title=Güvenlik politikası::web/index.html kodunun özeti politikayla eşleşmiyor: node tools/csp.js çalıştır."; exit 1; }
      - name: Test araçlarını kur
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Sunucusuz hava kodu (forecast-lib.js) güncel mi
        working-directory: tests
        run: node forecast-lib/build.mjs --check
      - name: Uygulamayı telefonda dene
        working-directory: tests
        env:
          TZ: Europe/Istanbul
        run: |
          set -o pipefail
          node run-web.js 2>&1 | tee web.log
      # Job logs cannot always be opened: failed checks also go into the run's annotations.
      - name: Test hatasını özetle
        if: failure()
        working-directory: tests
        run: |
          touch web.log
          grep -E "^(FAIL |BAŞARISIZ)|Error:" web.log | head -40 > fail.txt || true
          [ -s fail.txt ] && echo "::error title=Web testleri::$(sed -e 's/%/%25/g' -e 's/\r//g' fail.txt | awk '{printf "%s%%0A", $0}')" || true
      - name: Ekran görüntülerini sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-ekranlari
          path: tests/out/shots

  parity:
    name: Widget ve uygulama aynı öneriyi veriyor mu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin derleyicisini indir
        run: |
          curl -sSL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip
          unzip -q kotlinc.zip -d "$RUNNER_TEMP"
      - name: Eşlik testi
        env:
          N: "3000"
        run: KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" sh tests/parity/run.sh

  # The website's /api/* functions (MET Norway weather, Photon place search) with test data, no internet needed.
  api-tests:
    name: API testleri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API testleri (MET ve Photon olmadan)
        run: node --test tests/api

  # The watch face: its XML is generated (tools/build_face.py) and must match Google's Watch Face Format schema.
  watchface:
    name: Saat yüzü (Watch Face Format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Şemayı ve doğrulayıcıyı hazırla
        run: |
          pip install xmlschema==4.3.2
          git clone -q --depth 1 https://github.com/google/watchface.git "$RUNNER_TEMP/wff"
      - name: Üretilen XML güncel mi
        run: |
          python3 watchface/tools/build_face.py
          git diff --exit-code -- watchface/src/main/res \
            || { echo "::error title=Saat yüzü::watchface.xml ya da metinler build_face.py'den yeniden üretilmemiş."; exit 1; }
      - name: WFF v2 şemasına uyuyor mu
        run: |
          python3 watchface/tools/validate.py "$RUNNER_TEMP/wff/third_party/wff/specification/documents" 2 | tee wff.txt
          grep -q '^Geçerli' wff.txt || { echo "::error title=Saat yüzü::$(grep HATA wff.txt | head -5 | tr '\n' ' ')"; exit 1; }

  # The same code against the real MET Norway and Photon services. For information only: never stops the APK.
  api-live:
    name: API canlı deneme (MET Norway, Photon)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerçek servisleri dene
        env:
          MET_USER_AGENT: ${{ vars.MET_USER_AGENT }}
        run: node tests/api/live-smoke.mjs

  build:
    needs: [web-tests, parity, api-tests, watchface]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Optional repository secrets. Empty: Google's sample AdMob app ID and no banner. Test builds (not main) always
      # show Google's test banner instead of real ads, so testers' taps never count as invalid traffic.
      ADMOB_APP_ID: ${{ github.ref == 'refs/heads/main' && secrets.ADMOB_APP_ID || '' }}
      ADMOB_BANNER_ID: ${{ github.ref == 'refs/heads/main' && secrets.ADMOB_BANNER_ID || (secrets.ADMOB_BANNER_ID != '' && 'ca-app-pub-3940256099942544/6300978111' || '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"

      # With the NG_* secrets (RELEASE.md): the Play upload file (AAB) and an APK, both signed with the upload key.
      # Without them: the debug APK, as before.
      - name: İmza anahtarını hazırla
        id: key
        env:
          NG_KEYSTORE_BASE64: ${{ secrets.NG_KEYSTORE_BASE64 }}
          NG_KEYSTORE_PASSWORD: ${{ secrets.NG_KEYSTORE_PASSWORD }}
          NG_KEY_ALIAS: ${{ secrets.NG_KEY_ALIAS }}
          NG_KEY_PASSWORD: ${{ secrets.NG_KEY_PASSWORD }}
          THROWAWAY: ${{ github.event_name == 'workflow_dispatch' && inputs.deneme_imza && github.ref != 'refs/heads/main' }}
        run: |
          ks="$RUNNER_TEMP/upload-key.p12"
          if [ "$THROWAWAY" = "true" ]; then
            # Test only: a key made now and gone with the runner. Proves the release path; never for Play.
            pw=$(openssl rand -hex 24)
            echo "::add-mask::$pw"
            keytool -genkeypair -storetype PKCS12 -keystore "$ks" -alias deneme -keyalg RSA -keysize 2048 -validity 2 \
              -dname "CN=Ne Giysem deneme (gecici)" -storepass "$pw" -keypass "$pw" -noprompt
            alias=deneme; keypw="$pw"; mode=throwaway
          elif [ -n "$NG_KEYSTORE_BASE64" ]; then
            # Only the shape of the value is reported (length, how it starts and ends), never its content.
            # Line breaks, spaces and a Windows BOM from the paste are dropped before decoding.
            b64=$(printf '%s' "$NG_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
            dropped=$(( $(printf '%s' "$NG_KEYSTORE_BASE64" | wc -c) - ${#b64} ))
            shape="uzunluk ${#b64} (beklenen 5776), MII ile başlıyor: $(case "$b64" in MII*) echo evet;; *) echo hayır;; esac), = ile bitiyor: $(case "$b64" in *=) echo evet;; *) echo hayır;; esac), atılan boşluk/diğer bayt: $dropped"
            printf '%s' "$b64" | base64 -d > "$ks" 2>/dev/null || { echo "::error title=İmza::NG_KEYSTORE_BASE64 çözülemedi ($shape). negiysem-upload.p12.b64 dosyasının tamamını yeniden yapıştır."; exit 1; }
            echo "::notice title=İmza::NG_KEYSTORE_BASE64 çözüldü ($shape)."
            pw="$NG_KEYSTORE_PASSWORD"
            [ -n "$pw" ] || { echo "::error title=İmza::NG_KEYSTORE_PASSWORD secret'ı eksik."; exit 1; }
            alias="${NG_KEY_ALIAS:-negiysem-upload}"; keypw="${NG_KEY_PASSWORD:-$pw}"; mode=release
            keytool -list -keystore "$ks" -storepass "$pw" -alias "$alias" > /dev/null 2>&1 \
              || { if [ "${#b64}" -ne 5776 ]; then echo "::error title=İmza::Anahtar dosyası eksik ya da farklı görünüyor ($shape). NG_KEYSTORE_BASE64'e negiysem-upload.p12.b64 dosyasının tamamını yeniden yapıştır."; else echo "::error title=İmza::Anahtar açılamadı: NG_KEYSTORE_PASSWORD ya da NG_KEY_ALIAS yanlış (NG_KEY_ALIAS = negiysem-upload)."; fi; exit 1; }
          else
            # The debug key is public (app/debug.keystore): a real release signed with it could be "updated" by anyone.
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::error title=İmza::Yükleme anahtarı secret'ları yok: gerçek sürüm debug anahtarıyla yayımlanmaz (RELEASE.md)."
              exit 1
            fi
            echo "::notice title=İmza::Yükleme anahtarı secret'ları yok: yalnızca derleme denemesi (debug), yayımlanmaz (RELEASE.md)."
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "NG_KEYSTORE_FILE=$ks"
            echo "NG_KEYSTORE_PASSWORD=$pw"
            echo "NG_KEY_ALIAS=$alias"
            echo "NG_KEY_PASSWORD=$keypw"
          } >> "$GITHUB_ENV"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Uygulamayı derle
        env:
          MODE: ${{ steps.key.outputs.mode }}
        run: |
          set -o pipefail
          if [ "$MODE" = debug ]; then tasks="assembleDebug"; else tasks="bundleRelease assembleRelease"; fi
          gradle $tasks --no-daemon --stacktrace 2>&1 | tee build.log

      # Job logs cannot always be opened: the key lines also go into the run's annotations.
      - name: Derleme hatasını özetle
        if: failure()
        run: |
          note() { # one annotation per kind, newlines kept (%0A)
            [ -s "$2" ] || return 0
            echo "::error title=$1::$(sed -e 's/%/%25/g' -e 's/\r//g' "$2" | awk '{printf "%s%%0A", $0}')"
          }
          touch build.log
          grep -A25 "What went wrong" build.log | head -80 > what.txt || true
          grep -E "^e: " build.log | head -40 > kotlin.txt || true
          grep -iE -A6 "AAR metadata|requires libraries and applications|minCompileSdk|Android Gradle plugin" build.log | head -60 > aar.txt || true
          note "Gradle" what.txt
          note "Kotlin" kotlin.txt
          note "AAR" aar.txt

      - name: Dosyaları adlandır
        env:
          MODE: ${{ steps.key.outputs.mode }}
        run: |
          mkdir -p out
          if [ "$MODE" = debug ]; then
            cp app/build/outputs/apk/debug/app-debug.apk out/NeGiysem.apk
            cp watchface/build/outputs/apk/debug/watchface-debug.apk out/NeGiysem-SaatYuzu.apk
            cp wear/build/outputs/apk/debug/wear-debug.apk out/NeGiysem-SaatUygulamasi.apk
          else
            cp app/build/outputs/bundle/release/app-release.aab out/NeGiysem.aab
            cp app/build/outputs/apk/release/app-release.apk out/NeGiysem.apk
            cp watchface/build/outputs/bundle/release/watchface-release.aab out/NeGiysem-SaatYuzu.aab
            cp watchface/build/outputs/apk/release/watchface-release.apk out/NeGiysem-SaatYuzu.apk
            cp wear/build/outputs/bundle/release/wear-release.aab out/NeGiysem-SaatUygulamasi.aab
            cp wear/build/outputs/apk/release/wear-release.apk out/NeGiysem-SaatUygulamasi.apk
          fi

      # What Play checks, checked here first: target API, version number, signature, permissions, AdMob ID, 16 KB pages.
      - name: Dosyaları denetle
        env:
          MODE: ${{ steps.key.outputs.mode }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          apk=out/NeGiysem.apk; aab=out/NeGiysem.aab
          problem() { echo "!! $1"; } # collected from the report below; any one stops the build before publishing
          expected="android.permission.INTERNET android.permission.ACCESS_COARSE_LOCATION android.permission.ACCESS_FINE_LOCATION
            android.permission.ACCESS_NETWORK_STATE android.permission.WAKE_LOCK android.permission.RECEIVE_BOOT_COMPLETED
            android.permission.FOREGROUND_SERVICE android.permission.POST_NOTIFICATIONS com.google.android.gms.permission.AD_ID android.permission.ACCESS_ADSERVICES_AD_ID
            android.permission.ACCESS_ADSERVICES_ATTRIBUTION android.permission.ACCESS_ADSERVICES_TOPICS
            com.negiysem.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          check_perms() { # $1: label, stdin: one permission per line
            while read -r p; do
              [ -n "$p" ] || continue
              case " $(echo $expected) " in *" $p "*) echo "   $p";; *) echo "   $p   <-- BEKLENMEYEN"; problem "$1: beklenmeyen izin $p";; esac
            done
          }
          {
            echo "Ne Giysem? derleme denetimi · ${GITHUB_SHA::7} · çalıştırma ${GITHUB_RUN_NUMBER} · mod: $MODE · build-tools $(basename "$BT")"
            echo
            echo "== APK: $(stat -c %s "$apk") bayt"
            badging=$("$BT/aapt2" dump badging "$apk")
            echo "$badging" | grep -E "^(package:|sdkVersion|minSdkVersion|targetSdkVersion|application-debuggable)"
            echo "$badging" | grep -q "^targetSdkVersion:'36'" || problem "APK targetSdk 36 değil"
            echo "-- izinler (birleştirilmiş manifest)"
            echo "$badging" | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | check_perms APK
            echo "$badging" | grep -q "name='com.google.android.gms.permission.AD_ID'" || problem "AD_ID izni yok"
            echo "-- manifest ayrıntıları"
            tree=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
            echo "$tree" | grep -A1 '"com.google.android.gms.ads.APPLICATION_ID"' | sed -n 's/.*android:value([^)]*)="\([^"]*\)".*/   AdMob APPLICATION_ID = \1/p' | head -1
            echo "$tree" | grep -q '"com.google.android.gms.ads.APPLICATION_ID"' || problem "AdMob APPLICATION_ID meta-data yok"
            echo "$tree" | grep -q '"androidx.core.content.FileProvider"' && echo "   FileProvider: var" || problem "FileProvider yok"
            echo "$tree" | grep -E 'enableOnBackInvokedCallback' | sed 's/^ */   /' | head -1
            echo "-- imza (apksigner)"
            if "$BT/apksigner" verify --verbose --print-certs "$apk" > sig.txt 2>&1; then
              grep -E "^Verified using v[123] |^Number of signers|certificate DN|certificate SHA-256" sig.txt | sed 's/^/   /'
            else
              sed 's/^/   /' sig.txt | head -20; problem "APK imzası doğrulanamadı"
            fi
            echo "-- yerel kütüphaneler ve 16 KB sayfa"
            sos=$(unzip -Z1 "$apk" | grep -E '^lib/.+\.so$' || true)
            if [ -z "$sos" ]; then echo "   APK'da .so yok: 16 KB sayfa hizası gerekmez"; else
              echo "$sos" | sed 's/^/   /'
              rm -rf so && mkdir so && unzip -q "$apk" 'lib/*' -d so
              for f in $(find so -name '*.so'); do
                al=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
                echo "   ${f#so/}: LOAD hizası $al"
                for a in $al; do [ $((a)) -ge 16384 ] || problem "${f#so/} 16 KB hizalı değil ($a)"; done
              done
            fi
            echo "   zipalign -P 16: $("$BT/zipalign" -c -P 16 -v 4 "$apk" 2>&1 | tail -1)"
            if [ -f "$aab" ]; then
              echo
              echo "== AAB: $(stat -c %s "$aab") bayt"
              curl -sSfLo "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
              bt() { java -jar "$RUNNER_TEMP/bundletool.jar" "$@"; }
              bt validate --bundle="$aab" > /dev/null 2>&1 && echo "   bundletool validate: geçerli" || problem "bundletool validate hatası"
              for x in @package @android:versionCode @android:versionName uses-sdk/@android:minSdkVersion uses-sdk/@android:targetSdkVersion \
                       "application/@android:enableOnBackInvokedCallback" \
                       "application/meta-data[@android:name='com.google.android.gms.ads.APPLICATION_ID']/@android:value" \
                       "application/provider[@android:name='androidx.core.content.FileProvider']/@android:authorities"; do
                echo "   $x = $(bt dump manifest --bundle="$aab" --xpath="/manifest/$x" | tr '\n' ' ')"
              done
              [ "$(bt dump manifest --bundle="$aab" --xpath=/manifest/uses-sdk/@android:targetSdkVersion)" = 36 ] || problem "AAB targetSdk 36 değil"
              [ "$(bt dump manifest --bundle="$aab" --xpath=/manifest/uses-sdk/@android:minSdkVersion)" = 26 ] || problem "AAB minSdk 26 değil"
              [ "$(bt dump manifest --bundle="$aab" --xpath=/manifest/@android:versionCode)" = "$GITHUB_RUN_NUMBER" ] || problem "AAB versionCode çalıştırma numarası değil"
              echo "-- izinler (AAB)"
              bt dump manifest --bundle="$aab" --xpath=/manifest/uses-permission/@android:name | check_perms AAB
              echo "-- imza (jarsigner)"
              jarsigner -verify "$aab" 2>&1 | grep -q "jar verified" && echo "   jar verified" || problem "AAB imzası doğrulanamadı"
              keytool -printcert -jarfile "$aab" 2>/dev/null | grep -E "Owner:|SHA256:" | sed 's/^[[:space:]]*/   /'
              aabso=$(unzip -Z1 "$aab" | grep -E '/lib/.+\.so$' || true)
              [ -z "$aabso" ] && echo "   AAB'da .so yok" || echo "$aabso" | sed 's/^/   /'
            fi
            # The watch face: resources only (no code), Watch Face Format 2, Wear OS 5+ (API 34).
            wapk=out/NeGiysem-SaatYuzu.apk; waab=out/NeGiysem-SaatYuzu.aab
            echo
            echo "== Saat yüzü APK: $(stat -c %s "$wapk") bayt"
            wb=$("$BT/aapt2" dump badging "$wapk")
            echo "$wb" | grep -E "^(package:|minSdkVersion|targetSdkVersion|uses-feature:)"
            echo "$wb" | grep -q "^package: name='com.negiysem.app.watchface'" || problem "saat yüzü paket adı com.negiysem.app.watchface değil"
            echo "$wb" | grep -q "^minSdkVersion:'34'" || problem "saat yüzü minSdk 34 değil"
            echo "$wb" | grep -q "android.hardware.type.watch" || problem "saat yüzü android.hardware.type.watch istemiyor"
            wt=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$wapk")
            echo "$wt" | grep -q 'android:hasCode(0x[0-9a-f]*)=false' && echo "   hasCode=false" || problem "saat yüzünde hasCode=false yok"
            # The <property> whose name is the format version, read whole (attribute order varies).
            wfv=$(echo "$wt" | awk 'function flush(){ if (n ~ /watchface\.format\.version/) print v; n=""; v="" }
              /E: /{ flush(); inp = ($0 ~ /E: property/); next } inp && /android:name/{ n=$0 } inp && /android:value/{ v=$0 } END{ flush() }')
            # aapt2 prints it as a number (=2) or as text (="2").
            wfv=$(echo "$wfv" | sed -n 's/.*android:value([^)]*)="\{0,1\}\([^" ]*\).*/\1/p' | head -1)
            echo "   WFF sürümü: ${wfv:-yok}"
            [ "$wfv" = 2 ] || problem "WFF sürüm özelliği 2 değil (${wfv:-yok})"
            unzip -Z1 "$wapk" | grep -q '\.dex$' && problem "saat yüzü APK'sında kod (.dex) var" || echo "   kod yok (.dex yok)"
            # Release builds may shorten resource paths, so look the resource up by name.
            "$BT/aapt2" dump resources "$wapk" | grep -q 'raw/watchface' && echo "   raw/watchface paketlendi" || problem "watchface.xml paketlenmemiş"
            echo "   resimler: $("$BT/aapt2" dump resources "$wapk" | grep -c 'drawable/wf_') çıkartma"
            if "$BT/apksigner" verify --print-certs "$wapk" > wsig.txt 2>&1; then
              grep -E "certificate SHA-256" wsig.txt | sed 's/^/   /'
            else
              sed 's/^/   /' wsig.txt | head -10; problem "saat yüzü APK imzası doğrulanamadı"
            fi
            if [ -f "$waab" ]; then
              echo "== Saat yüzü AAB: $(stat -c %s "$waab") bayt"
              bt validate --bundle="$waab" > /dev/null 2>&1 && echo "   bundletool validate: geçerli" || problem "saat yüzü AAB bundletool hatası"
              jarsigner -verify "$waab" 2>&1 | grep -q "jar verified" && echo "   jar verified" || problem "saat yüzü AAB imzası doğrulanamadı"
            fi
            # The watch app (complication): the phone app's package and key, or the Data Layer won't connect them.
            uapk=out/NeGiysem-SaatUygulamasi.apk
            echo
            echo "== Saat uygulaması APK: $(stat -c %s "$uapk") bayt"
            ub=$("$BT/aapt2" dump badging "$uapk")
            echo "$ub" | grep -E "^(package:|minSdkVersion|targetSdkVersion|uses-feature:)"
            echo "$ub" | grep -q "^package: name='com.negiysem.app'" || problem "saat uygulamasının paket adı com.negiysem.app değil (telefonla eşleşmez)"
            echo "$ub" | grep -q "android.hardware.type.watch" || problem "saat uygulaması android.hardware.type.watch istemiyor"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$uapk" | grep -q "OutfitComplicationService" && echo "   karmaşıklık servisi var" || problem "karmaşıklık servisi manifestte yok"
            if "$BT/apksigner" verify --print-certs "$uapk" > usig.txt 2>&1; then
              grep -E "certificate SHA-256" usig.txt | sed 's/^/   /'
              if [ -f psig.txt ] || "$BT/apksigner" verify --print-certs "$apk" > psig.txt 2>&1; then
                [ "$(grep 'certificate SHA-256' psig.txt)" = "$(grep 'certificate SHA-256' usig.txt)" ] && echo "   telefonla aynı anahtar" || problem "saat uygulaması telefondan farklı anahtarla imzalı (eşleşmez)"
              fi
            else
              sed 's/^/   /' usig.txt | head -10; problem "saat uygulaması APK imzası doğrulanamadı"
            fi
          } > verify.txt 2>&1
          cat verify.txt
          { echo '```'; cat verify.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Denetim::$(sed -e 's/%/%25/g' -e 's/\r//g' verify.txt | awk '{printf "%s%%0A", $0}')"
          problems=$(grep '^!! ' verify.txt | sed 's/^!! //' | awk '{printf "%s%%0A", $0}')
          if [ -n "$problems" ]; then echo "::error title=Denetim::$problems"; exit 1; fi

      - name: İndirilebilir dosya olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: NeGiysem
          path: |
            out/
            verify.txt

      - name: Sürüm notunu yaz
        env:
          MODE: ${{ steps.key.outputs.mode }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/dev ]; then
            {
              echo "**Deneme sürümü** (dev dalı): yayına çıkmadan önce denemek için. Site ve Play bunu görmez."
              echo
              echo "**NeGiysem.apk**: telefona, kurulu uygulamanın üstüne kur. Deneme sitesinin sunucusunu kullanır: https://dev.ne-giysem.pages.dev"
              echo
              echo "Sonraki gerçek sürüm (Ne Giysem? N) bunun üstüne kurulur."
            } > notes.md
          elif [ "$MODE" = debug ]; then
            echo "Telefonuna kurmak için aşağıdaki NeGiysem.apk dosyasını indir." > notes.md
          else
            {
              echo "**NeGiysem.aab**: Google Play Console'a yüklenecek dosya (RELEASE.md)."
              echo
              echo "**NeGiysem.apk**: telefona doğrudan kurmak için, yükleme anahtarıyla imzalı. Telefonda eski (debug) sürüm varsa bu bir kez kaldırılıp kurulur."
              echo
              echo "**NeGiysem-SaatYuzu.apk / .aab**: Wear OS 5+ saat yüzü (Galaxy Watch 7 ve sonrası). Play'de ayrı bir uygulama kaydı olarak yüklenir."
              echo
              echo "**NeGiysem-SaatUygulamasi.apk / .aab**: saat uygulaması (Ne Giysem? karmaşıklığı, her saat yüzüne eklenir; telefondaki öneriyi gösterir). Play'de telefon uygulamasıyla aynı kayıtta, Wear OS kanalına yüklenir."
            } > notes.md
          fi

      # Only builds signed with the real upload key are published (the debug key is public). A test build (dev) is
      # published only as APKs: the .aab files Play takes are never next to a test build, so one can't be uploaded by mistake.
      - name: Sürümler sayfasında yayınla
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.key.outputs.mode == 'release' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref == 'refs/heads/main' && format('Ne Giysem? {0}', github.run_number) || format('Ne Giysem? deneme {0}', github.run_number) }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body_path: notes.md
          files: ${{ github.ref == 'refs/heads/main' && 'out/*' || 'out/*.apk' }}

  # The widget drawn on an emulator at many sizes, texts and font sizes: nothing may overlap, stick out or be clipped.
  # Its pictures and report are added to the release. For now it only reports; it doesn't stop the release.
  widget-look:
    name: Widget görünümü (emülatör)
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.6"
      - name: Uygulamayı ve testi derle
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: KVM'yi aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde çiz ve denetle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/widget-look.sh
      - name: Görüntüleri sürüme ekle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d widget-look ] || exit 0
          pip install -q pillow
          python3 .github/scripts/widget_sheet.py widget-look
          # one widget at full size, for the widget picker's preview (app/src/main/res/drawable-nodpi/widget_preview.png)
          cp widget-look/tr_f100_412x184.png widget-look/gorunum-onizleme.png 2>/dev/null || true
          files=$(ls widget-look/gorunum-*.png widget-look/rapor.txt 2>/dev/null)
          [ -n "$files" ] && gh release upload "$REL_TAG" $files --clobber || true

      # Only the newest three test builds are kept (the real releases all stay). Done last, after this run's own upload.
      - name: Eski deneme sürümlerini temizle
        if: always() && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^deneme-' | sort -t- -k2 -n -r | tail -n +4 |
            while read -r t; do gh release delete "$t" --cleanup-tag -y || true; done

