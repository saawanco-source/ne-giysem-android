name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Testers that run on every change: the app in a real browser (phone size), and web vs widget engine parity.
  web-tests:
    name: Web testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test araçlarını kur
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Uygulamayı telefonda dene
        working-directory: tests
        env:
          TZ: Europe/Istanbul
        run: node run-web.js
      - name: Ekran görüntülerini sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-ekranlari
          path: tests/out/shots

  parity:
    name: Widget ve uygulama aynı öneriyi veriyor mu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin derleyicisini indir
        run: |
          curl -sSL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlinc.zip -d "$RUNNER_TEMP"
      - name: Eşlik testi
        env:
          N: "3000"
        run: KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" sh tests/parity/run.sh

  # The website's /api/* functions (MET Norway weather, Photon place search) with test data, no internet needed.
  api-tests:
    name: API testleri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API testleri (MET ve Photon olmadan)
        run: node --test tests/api

  # The same code against the real MET Norway and Photon services. For information only: never stops the APK.
  api-live:
    name: API canlı deneme (MET Norway, Photon)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerçek servisleri dene
        env:
          MET_USER_AGENT: ${{ vars.MET_USER_AGENT }}
        run: node tests/api/live-smoke.mjs

  build:
    needs: [web-tests, parity, api-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK'yi derle
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Derleme hatasını özetle
        if: failure()
        run: |
          note() { # one annotation per kind, newlines kept (%0A)
            [ -s "$2" ] || return 0
            echo "::error title=$1::$(sed -e 's/%/%25/g' -e 's/\r//g' "$2" | awk '{printf "%s%%0A", $0}')"
          }
          touch build.log
          grep -A25 "What went wrong" build.log | head -80 > what.txt || true
          grep -E "^e: " build.log | head -40 > kotlin.txt || true
          grep -iE -A6 "AAR metadata|requires libraries and applications|minCompileSdk|Android Gradle plugin" build.log | head -60 > aar.txt || true
          note "Gradle" what.txt
          note "Kotlin" kotlin.txt
          note "AAR" aar.txt
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon > deps.txt 2>&1 || true
          grep -E "(androidx|kotlin|gms)[^ ]*:[^ ]* -> " deps.txt | sed 's/^[ |+\\-]*//' | sort -u | head -60 > up.txt || true
          note "Upgraded" up.txt

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk NeGiysem.apk

      - name: İndirilebilir dosya olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: NeGiysem-apk
          path: NeGiysem.apk

      - name: Sürümler sayfasında yayınla
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Ne Giysem? ${{ github.run_number }}
          body: Telefonuna kurmak için aşağıdaki NeGiysem.apk dosyasını indir.
          files: NeGiysem.apk
