name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Testers that run on every change: the app in a real browser (phone size), and web vs widget engine parity.
  web-tests:
    name: Web testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test araçlarını kur
        working-directory: tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Uygulamayı telefonda dene
        working-directory: tests
        env:
          TZ: Europe/Istanbul
        run: node run-web.js
      - name: Ekran görüntülerini sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-ekranlari
          path: tests/out/shots

  parity:
    name: Widget ve uygulama aynı öneriyi veriyor mu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Kotlin derleyicisini indir
        run: |
          curl -sSL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kotlinc.zip -d "$RUNNER_TEMP"
      - name: Eşlik testi
        env:
          N: "3000"
        run: KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" sh tests/parity/run.sh

  # The website's /api/* functions (MET Norway weather, Photon place search) with test data, no internet needed.
  api-tests:
    name: API testleri
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: API testleri (MET ve Photon olmadan)
        run: node --test tests/api

  # The same code against the real MET Norway and Photon services. For information only: never stops the APK.
  api-live:
    name: API canlı deneme (MET Norway, Photon)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gerçek servisleri dene
        env:
          MET_USER_AGENT: ${{ vars.MET_USER_AGENT }}
        run: node tests/api/live-smoke.mjs

  build:
    needs: [web-tests, parity, api-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK'yi derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk NeGiysem.apk

      - name: İndirilebilir dosya olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: NeGiysem-apk
          path: NeGiysem.apk

      - name: Sürümler sayfasında yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Ne Giysem? ${{ github.run_number }}
          body: Telefonuna kurmak için aşağıdaki NeGiysem.apk dosyasını indir.
          files: NeGiysem.apk
