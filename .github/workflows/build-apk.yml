name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK'yi derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk NeGiysem.apk

      - name: İndirilebilir dosya olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: NeGiysem-apk
          path: NeGiysem.apk

      - name: Sürümler sayfasında yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Ne Giysem? ${{ github.run_number }}
          body: Telefonuna kurmak için aşağıdaki NeGiysem.apk dosyasını indir.
          files: NeGiysem.apk
